<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Matriks Kinerja Pegawai BPS Blora · V25 v2.6</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#163f65;background:#edf4fb}
.mp-head{background:white;border-bottom:1px solid #d5e5f4;min-height:70px;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mp-brand{display:flex;align-items:center;gap:11px}.mp-mark{display:grid;place-items:center;width:40px;height:40px;background:linear-gradient(145deg,#147fc4,#1d4a98);color:white;border-radius:12px;font-size:17px;font-weight:900}
.mp-brand strong,.mp-brand span{display:block}.mp-brand strong{font-size:15px}.mp-brand span{font-size:11px;color:#62829d;margin-top:3px}
.mp-session{display:flex;align-items:center;gap:12px;font-size:12px;color:#567a96}.mp-logout{background:#eef6ff;border:1px solid #c5dcf0;border-radius:9px;padding:9px 12px;color:#18558c;font-weight:800;cursor:pointer}
.mp-login{min-height:calc(100dvh - 70px);display:grid;place-items:center;padding:25px}.mp-login-card{max-width:480px;width:100%;background:#fff;border:1px solid #ddeaf4;box-shadow:0 16px 50px #1547771d;border-radius:21px;padding:35px}
.mp-eyebrow{font-size:10px;font-weight:900;color:#1775b2;letter-spacing:1px}
.mp-login-card h1{font-size:25px;line-height:1.26;letter-spacing:-.4px;margin:15px 0}
.mp-login-card p{font-size:13px;line-height:1.7;color:#55738f}
.mp-primary{width:100%;background:linear-gradient(115deg,#137ac5,#155499);color:#fff;border:0;border-radius:11px;padding:14px 18px;font-weight:800;margin:11px 0 0;cursor:pointer}
.mp-primary:disabled{opacity:.55}.mp-login-card .mp-note{font-size:11px;margin-top:20px}.mp-login-card .mp-status{font-size:12px;color:#a64032}
.mp-frame-wrap{height:calc(100dvh - 70px)}#mpFrame{height:100%;width:100%;display:block;border:0}
[hidden]{display:none!important}
@media(max-width:700px){.mp-head{padding:10px 12px}.mp-brand strong{font-size:12px}.mp-brand span{font-size:9px}.mp-session span{display:none}.mp-login-card{padding:27px}}
</style></head>
<body><main id="app"><p style="padding:20px">Memuat Matriks Pegawai…</p></main>
<script type="module" src="/src/publicPreview.js"></script></body></html>
