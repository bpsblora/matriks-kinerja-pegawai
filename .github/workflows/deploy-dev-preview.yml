name: Deploy Firebase DEV preview (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate deployment identity configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$DEPLOY_SA" ]; then
            echo "::error::GitHub repository owner must set WIF provider and service-account variables first."
            exit 1
          fi
      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build Firebase DEV frontend
        run: |
          cp .env.example .env.local
          npm run build
      - name: Authenticate to Google Cloud without a service account key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy DEV preview channel only
        run: firebase hosting:channel:deploy matriks-dev --project mkp-bps-blora --expires 7d --non-interactive
