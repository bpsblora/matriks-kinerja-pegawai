name: Auto-update Firebase Matriks DEV Preview

on:
  push:
    branches:
      - setup/firebase-foundation
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-matriks-dev-preview
  cancel-in-progress: true

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify anonymous preview and closed Firestore
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rules = Path("firestore.rules").read_text()
          assert "allow read, write: if false;" in rules
          ref = json.loads(Path("src/data/reference2026.json").read_text())
          assert ref["meta"]["anonymized"] is True
          assert len(ref["employees"]) == 40
          assert len(ref["teams"]) == 25
          assert len(ref["kros"]) == 33
          print("DEV preview and rules verified.")
          PY

      - name: Verify complete V25 v2.6 anonymous prototype
        run: node scripts/verify-prototype.mjs

      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build website
        run: |
          cp .env.example .env.local
          npm run build
          test -f dist/index.html
          test ! -f dist/demo.html
          test -f dist/v26/part-001.txt
          test -f dist/v26/part-017.txt

      - name: Check keyless deployment configuration
        id: deploy-config
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Firebase preview deployment not connected. Set GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT in repository variables once."
          fi

      - name: Authenticate with Google Cloud (OIDC, no JSON keys)
        if: steps.deploy-config.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        if: steps.deploy-config.outputs.ready == 'true'
        run: npm install --global firebase-tools

      - name: Deploy matriks-dev PREVIEW only
        if: steps.deploy-config.outputs.ready == 'true'
        run: firebase hosting:channel:deploy matriks-dev --project mkp-bps-blora --expires 30d --non-interactive

  deploy-spark-role-rules-once:
    # One-shot activation explicitly authorized in chat on 2026-11-11.
    # This job NEVER runs on routine commits, nor when workflow_dispatch
    # starts the regular anonymous preview.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[FIREBASE_SPARK_RULES_ACTIVATE_ONCE]') && github.ref == 'refs/heads/setup/firebase-foundation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: mkp-bps-blora-firestore-rules-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Confirm strict release scope and rollback file
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = "refs/heads/setup/firebase-foundation"
          python3 - <<'PY'
          import json, pathlib
          firebase = json.loads(pathlib.Path('firebase.spark.json').read_text())
          assert firebase['firestore']['rules'] == 'firestore.spark.rules'
          assert 'allow read, write: if false;' in pathlib.Path('firestore.spark.rules').read_text()
          assert 'allow read, write: if false;' in pathlib.Path('firestore.bootstrap-readonly.rules').read_text()
          assert 'allow read, write: if false;' in pathlib.Path('firestore.rules').read_text()
          print('Safety: only role management collections can be opened')
          PY

      - name: Run Spark Firebase Emulator permission tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund @firebase/rules-unit-testing
          npm install --global firebase-tools
          firebase emulators:exec --project demo-matriks-spark --config firebase.spark.json --only firestore "node scripts/spark-rules.test.mjs"

      - name: Authenticate to Firebase DEV with existing keyless identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Publish tested Spark Firestore rules only
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --project mkp-bps-blora --config firebase.spark.json --only firestore:rules --non-interactive
          {
            echo "### Aktivasi aturan akun Firebase Spark"
            echo "✅ Firestore Emulator passed before deployment."
            echo "✅ Published role-account rules only to mkp-bps-blora; no Functions, Hosting, data import, or Blaze change."
            echo "🔒 Employee/activity matrix remains deny-all."
            echo "Rollback: firestore.bootstrap-readonly.rules"
          } >> "$GITHUB_STEP_SUMMARY"

# Standard preview job remains unchanged. The one-shot rule activation job
# is guarded by an exact approval marker in the push commit message.
