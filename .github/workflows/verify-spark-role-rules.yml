name: Test Spark role-account Firestore rules (no production access)

on:
  push:
    branches: [setup/firebase-foundation]
    paths:
      - "firestore.spark.rules"
      - "firebase.spark.json"
      - "scripts/spark-rules.test.mjs"
      - ".github/workflows/verify-spark-role-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install test dependencies only
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund @firebase/rules-unit-testing
          npm install --global firebase-tools
      - name: Run isolated Firestore Emulator authorization tests
        run: |
          firebase emulators:exec --project demo-matriks-spark --config firebase.spark.json --only firestore "node scripts/spark-rules.test.mjs"
          echo "### Hasil Pengujian Firestore Spark" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Berhasil: Admin membuat akun, mengubah username, rotasi password, pencabutan izin akun lama." >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Ditolak: Google biasa mengelola akun, Ketua Tim menaikkan peran sendiri, Admin mengubah perannya sendiri, akses data matriks." >> "$GITHUB_STEP_SUMMARY"
          echo "🔒 Pengujian dilakukan di emulator terpisah, **tidak men-deploy** Firebase produksi." >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm live Firestore rules remain closed by default
        run: |
          grep -q "allow read, write: if false;" firestore.rules
          grep -q "allow read, write: if false;" firestore.spark.rules
          grep -q "allow get: if" firestore.bootstrap-readonly.rules
          echo "No production database, Cloud Functions, service credentials, or billing used."
